<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiMapUI Dev Demos</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Fonts loaded locally via JS imports (see src/demos/main.tsx) -->
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; }
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: translateX(0); }
      50% { opacity: 0.6; transform: translateX(-2px); }
    }
    .pulse-hint { animation: pulse-glow 2s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/demos/main.tsx"></script>
</body>
</html>
