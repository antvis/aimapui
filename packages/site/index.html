<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIMAPUI 官网文档教程</title>
  <meta name="description" content="AIMAPUI 是一个基于 React 的地图组件库，提供丰富的地图可视化组件、交互控件和图层功能。支持高德、百度、腾讯、Mapbox 等多种地图引擎，适用于数据可视化、地理信息系统等场景。" />
