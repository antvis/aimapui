<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wanderlust | 沉浸式旅游足迹地图</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
}
@keyframes pulse-ring {
  0% { transform: scale(0.5); opacity: 1; }
  80%, 100% { transform: scale(2.2); opacity: 0; }
}
.pulse-dot::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: inherit;
  animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}
.photo-stack::before, .photo-stack::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.3);
  z-index: -1;
}
.photo-stack::before { transform: rotate(-6deg) translate(2px, 3px); }
.photo-stack::after { transform: rotate(4deg) translate(-2px, 2px); }
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}
@keyframes marquee {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

  /* ========== Dark Theme ========== */
  [data-theme="dark"] {
    --color-primary: #93c5fd;
    --color-primary-container: #1e3a5f;
    --color-success: #6ee7b7;
    --color-error: #fca5a5;
    --color-warning: #fcd34d;
    --color-on-surface: #e2e8f0;
    --color-on-surface-variant: #94a3b8;
    --color-surface: #0f172a;
    --color-outline-variant: #334155;
    --color-surface-container-low: #1e293b;
    --color-on-primary: #1e3a5f;
    --color-surface-container: #1e293b;
  }
  [data-theme="dark"] body { background: var(--color-surface); color: var(--color-on-surface); }
  [data-theme="dark"] .card { background: #1e293b; border-color: #334155; }
  [data-theme="dark"] code { background: #1e3a5f; color: #93c5fd; }
  [data-theme="dark"] .spec-table th { background: rgba(30,58,95,0.5); }
  [data-theme="dark"] .spec-table td { border-color: rgba(51,65,85,0.4); }
  [data-theme="dark"] .map-bg { background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e293b 100%); border-color: #334155; }
  [data-theme="dark"] .map-bg::before { opacity: 0.1; }
  [data-theme="dark"] h2 { border-color: #334155; }
  /* 手机框架暗色适配 */
  [data-theme="dark"] .phone-frame { border-color: #475569; background: linear-gradient(180deg, #1e293b 0%, #0f172a 50%, #1e293b 100%); }
  [data-theme="dark"] .search-bar { background: rgba(30,41,59,0.92); }
  [data-theme="dark"] .search-placeholder { color: #64748b; }
  [data-theme="dark"] .ctrl-btn { background: rgba(30,41,59,0.95); }
  [data-theme="dark"] .ctrl-btn .material-symbols-outlined { color: #e2e8f0; }
  [data-theme="dark"] .ctrl-group { background: rgba(30,41,59,0.95); }
  [data-theme="dark"] .bottom-sheet { background: rgba(30,41,59,0.96); }
  [data-theme="dark"] .bottom-nav { background: rgba(30,41,59,0.92); border-color: #334155; }
  /* 形状卡片 */
  [data-theme="dark"] .shape-card { background: #1e293b; border-color: #334155; }
  [data-theme="dark"] .shape-card:hover { box-shadow: 0 8px 24px rgba(147,197,253,0.08); }
  /* 性能/手势卡片 */
  [data-theme="dark"] .perf-item,
  [data-theme="dark"] .gesture-card,
  [data-theme="dark"] .collision-box,
  [data-theme="dark"] .zoom-card { background: #1e293b; border-color: #334155; }
  /* 侧边栏 (PC) */
  [data-theme="dark"] .sidebar { background: rgba(15,23,42,0.92); border-color: #334155; }
  [data-theme="dark"] .sidebar-item:hover { background: rgba(147,197,253,0.08); }
  /* 底部面板状态 */
  [data-theme="dark"] .sheet-state-box { border-color: #334155; }
  [data-theme="dark"] .sheet-state-map { background: linear-gradient(135deg, #1e293b, #0f172a); }
  [data-theme="dark"] .sheet-state-panel { background: rgba(30,41,59,0.95); }
  /* SVG 文字 */
  [data-theme="dark"] svg text[fill="#434655"],
  [data-theme="dark"] svg text[fill="#1e293b"] { fill: #e2e8f0; }
  [data-theme="dark"] svg text[fill="#64748b"] { fill: #94a3b8; }

  /* 主题切换按钮 */
  .theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 9999;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--color-outline-variant);
    background: var(--color-surface-container-low); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: background 0.2s, border-color 0.2s;
    font-size: 18px; line-height: 1;
  }
  .theme-toggle:hover { background: var(--color-primary-container); }

</style>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#7C3AED",

        "outline": "#cbd5e1",

      spacing: {
        "gutter": "16px",
        "panel-gap": "12px",
      },
      fontFamily: {
        "sans": ["Inter", "system-ui", "sans-serif"],
      },
    }
  }
}
</script>
</head>

<script>
function toggleMapMode() {
  const selector = document.getElementById('mapModeSelector');
  selector.classList.toggle('hidden');
}
document.addEventListener('click', (e) => {
  const selector = document.getElementById('mapModeSelector');
  const icon = document.getElementById('mapModeIcon');
  if (!selector.contains(e.target) && !icon.parentElement.contains(e.target)) {
    selector.classList.add('hidden');
  }
});
</script>
<button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
<script>
(function() {
  var toggle = document.getElementById('themeToggle');
  var html = document.documentElement;
  var stored = localStorage.getItem('design-spec-theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var initial = stored || (prefersDark ? 'dark' : 'light');
  html.setAttribute('data-theme', initial);
  toggle.textContent = initial === 'dark' ? '☀️' : '🌙';
  toggle.addEventListener('click', function() {
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    toggle.textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('design-spec-theme', next);
  });
})();
</script>
